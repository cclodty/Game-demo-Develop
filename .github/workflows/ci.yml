name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - run: npm run lint

      - name: Unit, map, pipeline and bot tests
        run: npm test

      - name: Single-file build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: bullet-ballet-single-file
          path: dist/bullet-ballet.html

      - name: Test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test/.out/
          if-no-files-found: ignore
          include-hidden-files: true
