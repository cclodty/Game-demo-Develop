name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # npm test in three shards at once (package.json test:shard; Node deals the files out in turn): about a third of
    # the wait. test/ci.test.mjs checks the shards still run every file npm test runs.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - run: npm run lint

      - name: Unit, map, pipeline and bot tests (one shard)
        run: npm run test:shard
        env:
          SHARD: ${{ matrix.shard }}/3

      - name: Single-file build
        if: matrix.shard == 1
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: matrix.shard == 1
        with:
          name: bullet-ballet-single-file
          path: dist/bullet-ballet.html

      - name: Test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-${{ matrix.shard }}
          path: test/.out/
          if-no-files-found: ignore
          include-hidden-files: true
